# Extend the built-in gitleaks ruleset.
[extend]
useDefault = true

# A harness token the default ruleset does not recognise: only the variable name
# identifies it, so the key is matched against a shape-free value class - it
# catches strictly more, and says nothing about what the value looks like. The
# excluded leading characters keep an empty `KEY=`, a documented placeholder and
# this definition itself from reading as a hit.
#
# It belongs in .env.e2e.local (git-ignored), never in a tracked file -
# .env.e2e.example is loaded as a REAL default (e2e/lib/load-env.ts), so it reads
# like a working file and is the likely place to fill one in by mistake.
#
# Keep in lockstep with E2E_CREDENTIAL_PATTERN in scripts/lib/secret-patterns.sh,
# which gates the same shape at release; this rule runs on every commit, which
# is the point of having both.

[[rules]]
id = "emojery-playwright-mcp-token"
description = "Playwright Extension bridge token (PLAYWRIGHT_MCP_EXTENSION_TOKEN)"
regex = '''PLAYWRIGHT_MCP_EXTENSION_TOKEN=[^[:space:]<"$[]'''
keywords = ["playwright_mcp_extension_token"]

# The log-redaction unit test embeds the well-known jwt.io sample token
# (header {"alg":"HS256"}, payload {"sub":"1234567890"}) to prove JWT-shaped
# values get redacted. It is a public example, not a real secret.
# Revisit 2027-02: drop this entry if that test stops embedding the sample.
[allowlist]
description = "jwt.io sample token used by the log-redaction unit test (not a real secret)"
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''']
