packages:
  - .

# Transitive-only floors for published advisories. All of them are dev/build
# toolchain: the shipped extension depends on preact + emojibase-data only.
# Ranges (not exact pins) so later patch releases still flow in; the lockfile
# is what freezes the resolved version. Drop a line once the parent's own range
# no longer resolves below the floor (`pnpm why <pkg>`), then re-run
# `pnpm audit` to confirm nothing came back.
overrides:
  "@hono/node-server": ^2.0.11 # GHSA-9mqv-5hh9-4cgg, patched in 2.0.10
  adm-zip: ^0.6.1 # GHSA-xcpc-8h2w-3j85, GHSA-7q85-xj36-vmfc, GHSA-vwc7-r8mq-g2x9
