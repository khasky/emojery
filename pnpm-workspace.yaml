  browserslist: ^4.28.7 # GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx
  fast-uri: ^3.1.6 # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp
