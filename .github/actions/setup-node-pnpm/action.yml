name: Setup Node and pnpm
description: >-
  pnpm, Node (with the pnpm cache) and a frozen-lockfile install - the three steps every
  job here starts with. Checkout stays in the calling job: a local action can only run
  from an already checked-out tree, and each workflow needs its own checkout options.
  setup-e2e composes this and adds the browser half.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
