name: CI

on:
  push:
    branches: [main]
    # A push that changes only prose has nothing for the gates below to check.
    # Markdown is still linted: `lint:docs` covers the whole tree, so the next
    # code push reads every page, and every pull request runs it regardless -
    # `paths-ignore` here is on `push` only, so a required check never waits on
    # a workflow that did not start.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs land as a squash merge, so the message that reaches `main` - the one the
  # version bump and CHANGELOG.md are derived from - is the PR title, and no
  # hook can see it: `commit-msg` only runs on the commits inside the branch.
  # This validates the title's shape; the full rule set (scope-enum, the revert
  # and breaking footers) stays in commitlint.config.js, where a title with no
  # body could never satisfy it.
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the title; the action reports through its own check run
    steps:
      # Default type list is conventional-commit-types, the same set commitlint
      # enforces here - see CONTRIBUTING.md -> Commit messages.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A branch's own commits are already gated by the hook, and they are
          # squashed away on merge - only the title survives.
          validateSingleCommit: false

  check:
    name: Typecheck, lint, test, build, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same composite the browser-suite workflows use: node + pnpm, and the two
      # browsers `pnpm test:browser` drives. `build: false` - this job builds
      # further down, for chrome AND firefox, not just the staging bundle.
      - name: Setup Node, pnpm and Playwright browsers
        uses: ./.github/actions/setup-e2e
        with:
          browser: webkit firefox
          build: "false"

      - name: Typecheck
        run: pnpm compile

      # Playwright transpiles the e2e specs with esbuild, which type-checks
      # nothing - without this they drift silently.
      - name: Typecheck e2e specs
        run: pnpm compile:e2e

      - name: Typecheck build scripts
        run: pnpm compile:scripts

      - name: Lint
        run: pnpm lint

      # The one e2e spec that needs neither a browser nor the network (a pure
      # self-check of lib/coext-source). It already has its own zero-retry
      # Playwright project so it can gate a PR; verified to run with an empty
      # PLAYWRIGHT_BROWSERS_PATH, so no `playwright install` is needed here.
      # Everything else in e2e/ drives live sites and stays on the sweep
      # schedules (e2e-ci.yml).
      - name: E2E hermetic self-check
        run: pnpm test:e2e:hermetic

      # Same suite as `pnpm test`, with the coverage report printed for the log.
      # No thresholds - coverage never fails this step.
      - name: Unit tests with coverage report
        run: pnpm test:coverage

      - name: Browser-mode tests (WebKit + Firefox)
        run: pnpm test:browser

      - name: Build unpacked extensions (chrome + firefox)
        run: pnpm build:all

      # The build above re-ran `prepare:assets`, so anything it rewrote here was
      # committed stale - and every gate in this job ran against the stale copy.
      # --intent-to-add first: a plain diff sees tracked files only, and a locale
      # added to the list generates a file that is untracked, not modified.
      - name: Generated assets are committed
        run: |
          git add --intent-to-add -- public/emoji-data src/shared/__generated__
          git diff --exit-code -- public/emoji-data src/shared/__generated__

      - name: Content-script weight budget
        run: pnpm check:bundle

      - name: Package browser zips (chrome + firefox)
        run: pnpm zip:all

      - name: Scan generated Chrome extension files
        shell: bash
        run: bash scripts/scan-extension-artifact.sh .output/chrome-mv3

      # The MV2 bundle is signed into an .xpi and shipped to AMO by release.yml,
      # so it gates on exactly the same rules as the MV3 one.
      - name: Scan generated Firefox extension files
        shell: bash
        run: bash scripts/scan-extension-artifact.sh .output/firefox-mv2

      - name: Scan AMO source archive
        shell: bash
        run: bash scripts/scan-source-archive.sh

      # `!cancelled()`: a red test above must not swallow the Markdown result.
      # Rule set + rationale for each disabled rule: .markdownlint-cli2.jsonc
      - name: Lint Markdown
        if: ${{ !cancelled() }}
        run: pnpm lint:docs
