name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks lists the PR's commits to pick its scan range.
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# All three scans share one job: Actions bills each job rounded up to a whole
# minute, and these scans take well under one each. Three runners would cost a
# 3-minute floor for ~2 minutes of work, plus a checkout apiece. The cost is that the three results
# arrive as a single check - hence `${{ !cancelled() }}` on every scan below, so
# a red scan still lets the rest report rather than hiding them behind the first
# failure.
jobs:
  scan:
    name: OSV, secrets, SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history is gitleaks' requirement, not the other steps' - it scans
      # every commit, so a shallow clone would silently narrow the sweep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads pnpm-lock.yaml directly, so this is the dependency-CVE gate.
      # `pnpm audit --audit-level high` used to run beside it and was removed:
      # it failed on anything.
      - name: Scan dependencies
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

      # On `pull_request` the action hard-requires a token: it derives the scan
      # range from `GET /pulls/{n}/commits` and exits 1 without one, so every PR
      # ran red. Comments stay off - that path is the only one wanting write, and
      # the findings already land in the job summary.
      - name: Detect committed secrets
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Semgrep
        if: ${{ !cancelled() }}
        run: python -m pip install semgrep==1.172.0

      # `--error` is what makes this a gate: `semgrep scan` exits 0 even with
      # findings, so without it the job stays green and the rules are decoration.
      # The binary is pinned, the two registry rule packs deliberately are not:
      # accepting upstream rule drift is the point of tracking them, so a red
      # run after a pack update is expected and read as new signal, not a break.
      - name: Run Semgrep rules
        if: ${{ !cancelled() }}
        run: semgrep scan --error --config p/default --config p/secrets
